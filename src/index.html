<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SPOTS" />
    <meta name="keywords" content="spots, Bessie Coleman" />
    <meta name="author" content="Philip Ruddiman" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          class="header__logo"
          src="./images/spots_logo.svg"
          alt="Spots menubar logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn" type="button">
              <img
                class="profile__pencil-icon"
                src="./images/Light_Pencil_Avatar.svg"
                alt="Profile Avatar Pencil Icon"
              />
            </button>
            <img
              class="profile__avatar"
              src="./images/Avatar.jpg"
              alt="Bessie Coleman Avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__title">Bessie Coleman</h1>
            <p class="profile__subtitle">Civil Aviator</p>
            <button class="profile__edit-button" type="button">
              <img
                src="./images/Light_Pencil_Icon.svg"
                alt="Edit Profile Button"
              />Edit Profile
            </button>
          </div>
          <button class="profile__new-post" type="button">
            <img
              src="./images/Plus_Icon.svg"
              alt="New Post"
              class="profile__plus-image"
            />New Post
          </button>
        </section>
        <section class="cards">
          <ul class="cards__list"></ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__copyright">2023 &reg; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button class="modal__close-button" type="button">
            <img
              src="./images/Close_Icon.svg"
              alt="Close Button"
              class="modal__close-icon"
            />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form" name="edit_profile" id="editprofile-form">
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                class="modal__input"
                type="text"
                placeholder="Type your name"
                id="profile-name-input"
                minlength="2"
                maxlength="40"
                required
              />
              <span
                id="profile-name-input-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                class="modal__input"
                type="text"
                placeholder="Describe yourself"
                id="profile-description-input"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>
            <button class="modal__save-button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button class="modal__close-button" type="button">
            <img
              src="./images/Close_Icon.svg"
              alt="Close Button"
              class="modal__close-icon"
            />
          </button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form" name="new_post" id="newpost-form">
            <label for="image-post" class="modal__label"
              >Image link
              <input
                class="modal__input"
                type="url"
                placeholder="Paste a link to the picture"
                id="image-post"
                required
              />
              <span
                id="image-post-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>
            <label for="caption-post" class="modal__label"
              >Caption
              <input
                class="modal__input"
                type="text"
                placeholder="Type your Caption"
                id="caption-post"
                minlength="2"
                maxlength="30"
                required
              />
              <span
                id="caption-post-error"
                class="modal__error modal__error_visible"
              ></span>
            </label>
            <button class="modal__save-button" type="submit">Save</button>
          </form>
        </div>
      </div>
      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            class="modal__close-button modal__close-button_type_preview"
            type="button"
          >
            <img
              src="./images/Close_icon_white.svg"
              alt="Close Button"
              class="modal__close-icon"
            />
          </button>
          <img class="modal__image" src="#" alt="" />
          <h2 class="modal__caption"></h2>
        </div>
      </div>
    </div>
    <template id="card-template">
      <li class="card">
        <button class="card__button-delete" type="button">
          <img src="./images/State=Default.svg" alt="Delete Button" />
        </button>
        <img class="card__image" src="#" alt="" />
        <div class="card__content">
          <h2 class="card__title"></h2>
          <button class="card__button" type="button"></button>
        </div>
      </li>
    </template>

    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button class="modal__close-button" type="button">
          <img
            src="./images/Close_Icon.svg"
            alt="Close Button"
            class="modal__close-icon"
          />
        </button>
        <h2 class="modal__title">Edit Avatar</h2>
        <form class="modal__form" name="edit_avatar" id="edit-avatar-image">
          <label for="profile-avatar-input" class="modal__label"
            >Avatar
            <input
              class="modal__input"
              name="edit_avatar"
              placeholder="Insert Image"
              id="profile-avatar-input"
              required
            />
            <span
              id="profile-avatar-input-error"
              class="modal__error modal__error_visible"
            ></span>
          </label>
          <button class="modal__save-button" type="submit">Save</button>
        </form>
      </div>
    </div>

    <!--TODO style modal and remove modal is opened class when hidden-->

    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <button
          class="modal__close-button modal__close-button_type_delete"
          type="button"
        >
          <img
            src="./images/Close_Icon.svg"
            alt="Close Button"
            class="modal__close-icon"
          />
        </button>
        <h2 class="modal__delete-title">
          Are you sure you want to delete this image?
        </h2>
        <form class="modal__form" name="delete_form" id="delete-form">
          <div class="modal__button-container">
            <button class="modal__delete-button" type="submit">Delete</button>
            <button class="modal__cancel-button" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
